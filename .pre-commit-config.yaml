default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff
        args: [--fix]
        stages: [pre-commit]
      - id: ruff-format
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: pyright
        name: pyright (strict)
        entry: uv run --frozen --group dev pyright
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]

      - id: deptry
        name: dependency declarations
        entry: uv run --frozen --group dev deptry .
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]

      - id: pytest-coverage
        name: tests and branch coverage
        entry: >-
          uv run --frozen pytest
          --cov=fgcz_reference_project
          --cov-branch
          --cov-report=xml:coverage.xml
          --cov-report=term-missing
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]

      - id: diff-cover
        name: changed-line coverage
        entry: uv run --frozen python scripts/diff_coverage.py
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]

      - id: package-smoke
        name: package smoke
        entry: uv run --frozen python scripts/package_smoke.py
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]

      - id: mkdocs-strict
        name: strict documentation build
        entry: uv run --frozen --group docs mkdocs build --strict
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]

      - id: dependency-audit
        name: dependency vulnerability audit
        entry: uv run --frozen pip-audit --local --skip-editable --progress-spinner=off
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
